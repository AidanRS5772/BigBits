[package]
name = "big_bits"
version = "0.1.0"
edition = "2021"

[dev-dependencies]
criterion = "0.5.1"
rand = "0.8.5"

[dependencies]
nalgebra = { version = "0.34", optional = true }
rayon = "1.12.0"
rustfft = "6.4.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.prof]
inherits = "release"
debug = 2
strip = "none"
lto = "thin"
panic = "unwind"

[profile.bench]
lto = "thin"
codegen-units = 1

[features]
# Live knob values for the tuner and the random-knob test (docs/tuning_system.md). For tuning
# builds only: it makes every knob read an atomic instead of a constant, and pulls in the fitting
# library (nalgebra, whose SVD solves every fit), which normal builds never compile.
tune = ["dep:nalgebra"]
_bench_internals = []
_fft_cutoffs = []

[[bench]]
name = "utils_bench"
harness = false
required-features = ["_bench_internals"]

[[bench]]
name = "div_profile"
harness = false

[[bench]]
name = "binom_sqrt_profile"
harness = false

[[bench]]
name = "bin_split_profile"
harness = false

[[bench]]
name = "tuning_bias"
harness = false

# The tuner: `cargo tune ...` (an alias in .cargo/config.toml). Release profile, as that is what ships.
[[example]]
name = "tune"
required-features = ["tune"]
